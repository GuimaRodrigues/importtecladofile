[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "yamaha-library-subsetter"
version = "0.4.0"
description = "Conservative Yamaha MONTAGE/MODX library inspector and subset exporter"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yamaha Library Subsetter contributors" }]
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]
build = ["PyInstaller>=6.11"]

[project.scripts]
yamaha-library = "yamaha_library.cli:main"
yamaha-library-gui = "yamaha_library.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/yamaha_library"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["yamaha_library"]

[tool.ruff]
target-version = "py312"
line-length = 100
